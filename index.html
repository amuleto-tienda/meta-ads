<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Pauta — Amuleto / Emprender en Orden</title>
<style>
  :root{
    --bg:#f5f5f3; --border:#e2e2df; --text:#1c1c1a; --muted:#77766f;
    --red-bg:#fbe1e1; --red-tx:#8c2a2a; --amber-bg:#fbeecb; --amber-tx:#8a5b0a; --green-bg:#e1f0d8; --green-tx:#2e6b1f;
    --accent:#2f5f4f;
  }
  *{box-sizing:border-box;}
  body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:20px;}
  h1{font-size:18px;margin:0 0 16px;}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}
  button{font-size:13px;padding:6px 14px;border:1px solid var(--border);background:#fff;border-radius:6px;cursor:pointer;}
  button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  input,select{font-size:12px;padding:4px 6px;border:1px solid var(--border);border-radius:4px;}
  table{width:100%;border-collapse:collapse;font-size:11.5px;background:#fff;}
  th,td{padding:6px;border-bottom:1px solid var(--border);text-align:left;}
  th{background:#fafaf8;color:var(--muted);font-weight:bold;white-space:nowrap;}
  .tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:8px;}
  .off{opacity:.4;}
  .r-ok{background:var(--green-bg);color:var(--green-tx);}
  .r-warn{background:var(--amber-bg);color:var(--amber-tx);}
  .r-bad{background:var(--red-bg);color:var(--red-tx);}
  .card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:12px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}
  .metric{background:#fafaf8;border-radius:6px;padding:12px;}
  .metric p{margin:0;}
  .metric .lbl{font-size:12px;color:var(--muted);}
  .metric .val{font-size:20px;font-weight:bold;}
  .rank{font-size:12px;}
  .rank div{display:flex;justify-content:space-between;padding:5px 6px;border-bottom:1px solid var(--border);}
  .hidden{display:none;}
  .config{font-size:12px;color:var(--muted);}
</style>
</head>
<body>
<h1>Pauta Meta Ads</h1>

<div class="row">
  <button id="brand-amuleto" class="active">Amuleto</button>
  <button id="brand-emprender">Emprender en Orden</button>
  <span style="flex:1"></span>
  <button id="btn-config">Configurar URLs</button>
</div>

<div id="config-panel" class="card hidden">
  <p class="config">Pegá acá la URL de cada Apps Script Web App. Se guarda en este navegador.</p>
  <div class="row"><label style="width:160px">URL Amuleto</label><input id="url-amuleto" style="flex:1" placeholder="https://script.google.com/macros/s/.../exec"></div>
  <div class="row"><label style="width:160px">URL Emprender en Orden</label><input id="url-emprender" style="flex:1" placeholder="https://script.google.com/macros/s/.../exec"></div>
  <button id="save-config">Guardar</button>
</div>

<div class="row" id="tabbar">
  <button id="tab-creativos" class="active">Creativos</button>
  <button id="tab-publicos">Públicos</button>
  <button id="tab-estructura">Estructura</button>
  <button id="tab-reglas">Reglas</button>
  <button id="tab-resumen">Resumen</button>
</div>

<div id="panel-creativos">
  <div class="row"><button id="btn-nuevo-creativo">+ Creativo</button><button id="btn-refrescar-c">Refrescar</button></div>
  <div id="form-creativo" class="card hidden">
    <div class="row"><label style="width:110px">Título (Hook)</label><input id="fc-titulo" style="flex:1"></div>
    <div class="row"><label style="width:110px">Formato</label><select id="fc-formato" style="flex:1"></select><button data-tipo="formato" data-target="fc-formato" class="btn-add-opcion">+</button></div>
    <div class="row"><label id="fc-hook-label" style="width:110px">Hook</label><select id="fc-hook" style="flex:1"></select><button data-tipo="hook" data-target="fc-hook" class="btn-add-opcion">+</button></div>
    <div class="row"><label style="width:110px">Producto</label><select id="fc-producto" style="flex:1"></select><button data-tipo="producto" data-target="fc-producto" class="btn-add-opcion">+</button></div>
    <div class="row"><label style="width:110px">Ángulo/dolor</label><select id="fc-angulo" style="flex:1"></select><button data-tipo="angulo" data-target="fc-angulo" class="btn-add-opcion">+</button></div>
    <div class="row"><button id="fc-guardar">Guardar creativo</button><button id="fc-cancelar">Cancelar</button></div>
  </div>
  <div class="tbl-wrap"><table id="tabla-creativos"></table></div>
</div>

<div id="panel-publicos" class="hidden">
  <div class="row"><button id="btn-nuevo-publico">+ Público</button></div>
  <div id="form-publico" class="card hidden">
    <div class="row"><label style="width:110px">Título</label><input id="fp-titulo" style="flex:1"></div>
    <div class="row"><label style="width:110px">Intereses</label><input id="fp-intereses" style="flex:1"></div>
    <div class="row"><button id="fp-guardar">Guardar público</button><button id="fp-cancelar">Cancelar</button></div>
  </div>
  <div class="tbl-wrap"><table id="tabla-publicos"></table></div>
</div>

<div id="panel-estructura" class="hidden">
  <div class="row">
    <button id="filter-activos" class="active">Solo activos</button>
    <button id="filter-todos">Todos</button>
    <select id="filtro-campana" style="min-width:140px"><option value="">Todas las campañas</option></select>
    <select id="filtro-conjunto" style="min-width:140px"><option value="">Todos los conjuntos</option></select>
    <input id="filtro-anuncio" placeholder="Buscar anuncio..." style="min-width:160px">
    <span style="flex:1"></span>
    <button id="btn-nueva-estructura">+ Estructura</button>
    <button id="btn-nuevo-dato">+ Dato semanal</button>
  </div>
  <div id="form-estructura" class="card hidden">
    <div class="row">
      <label style="width:110px">Campaña</label>
      <select id="fe-campana-select" style="flex:1"></select>
      <input id="fe-campana-nueva" style="flex:1" placeholder="Nombre de la campaña nueva" class="hidden">
    </div>
    <div class="row">
      <label style="width:110px">Público</label>
      <select id="fe-publico-select" style="flex:1"></select>
    </div>
    <div id="fe-publico-nuevo" class="hidden" style="margin:0 0 8px 118px">
      <div class="row"><input id="fe-publico-titulo" placeholder="Título del público" style="flex:1"><input id="fe-publico-intereses" placeholder="Intereses" style="flex:1"></div>
    </div>
    <div class="row">
      <label style="width:110px">Creativo</label>
      <select id="fe-creativo-select" style="flex:1"></select>
    </div>
    <div id="fe-creativo-nuevo" class="hidden" style="margin:0 0 8px 118px">
      <div class="row"><input id="fe-creativo-titulo" placeholder="Título del creativo" style="flex:1"></div>
      <div class="row">
        <select id="fe-creativo-formato" style="flex:1"></select>
        <select id="fe-creativo-hook" style="flex:1"></select>
        <select id="fe-creativo-producto" style="flex:1"></select>
        <select id="fe-creativo-angulo" style="flex:1"></select>
      </div>
    </div>
    <div class="row"><label style="width:110px">Fecha inicio</label><input id="fe-fecha" type="date" style="flex:1"></div>
    <div class="row"><button id="fe-guardar">Crear estructura</button><button id="fe-cancelar">Cancelar</button></div>
  </div>
  <div id="form-dato" class="card hidden">
    <div class="row"><label style="width:110px">Campaña &gt; Conjunto &gt; Anuncio</label><select id="fd-fila" style="flex:1"></select></div>
    <div class="row"><label style="width:110px">Antigüedad</label><select id="fd-dias" style="flex:1"></select></div>
    <div id="fd-metricas"></div>
    <div class="row"><button id="fd-guardar">Guardar dato</button><button id="fd-cancelar">Cancelar</button></div>
  </div>
  <div class="tbl-wrap"><table id="tabla-estructura"></table></div>
</div>

<div id="panel-reglas" class="hidden">
  <div class="card">
    <p><b>Sintaxis:</b> METRICA operador valor, combinando con Y / O. Operadores: &gt; &lt; &gt;= &lt;= =</p>
    <table id="tabla-reglas"></table>
    <div class="row" style="margin-top:10px">
      <button id="btn-agregar-regla">+ Agregar regla</button>
      <button id="btn-guardar-reglas">Guardar reglas</button>
    </div>
  </div>
</div>

<div id="panel-resumen" class="hidden">
  <div class="row">
    <button class="periodo active" data-dias="7">7 días</button>
    <button class="periodo" data-dias="15">15 días</button>
    <button class="periodo" data-dias="30">30 días</button>
    <button class="periodo" data-dias="0">Máximo</button>
  </div>
  <div class="grid" id="resumen-cards"></div>
  <div class="grid" style="margin-top:16px" id="resumen-rankings"></div>
</div>

<script>
const METRIC_LABELS = { amuleto: ['CPC','ROAS','Compras'], emprender: ['CPR','Resultados','Seguimientos'] };
let brand = 'amuleto';
let data = null;

function urls(){ return { amuleto: localStorage.getItem('url_amuleto')||'', emprender: localStorage.getItem('url_emprender')||'' }; }
function currentUrl(){ return urls()[brand]; }

document.getElementById('btn-config').onclick = ()=>{
  document.getElementById('config-panel').classList.toggle('hidden');
  document.getElementById('url-amuleto').value = urls().amuleto;
  document.getElementById('url-emprender').value = urls().emprender;
};
document.getElementById('save-config').onclick = ()=>{
  localStorage.setItem('url_amuleto', document.getElementById('url-amuleto').value.trim());
  localStorage.setItem('url_emprender', document.getElementById('url-emprender').value.trim());
  document.getElementById('config-panel').classList.add('hidden');
  cargar();
};
function setBrand(b){
  brand = b;
  document.getElementById('brand-amuleto').classList.toggle('active', b==='amuleto');
  document.getElementById('brand-emprender').classList.toggle('active', b==='emprender');
  cargar();
}
document.getElementById('brand-amuleto').onclick = ()=>setBrand('amuleto');
document.getElementById('brand-emprender').onclick = ()=>setBrand('emprender');

const TABS = ['creativos','publicos','estructura','reglas','resumen'];
TABS.forEach(t=>{
  document.getElementById('tab-'+t).onclick = ()=>{
    TABS.forEach(x=>{
      document.getElementById('tab-'+x).classList.toggle('active', x===t);
      document.getElementById('panel-'+x).classList.toggle('hidden', x!==t);
    });
  };
});

async function postAction(body){
  const u = currentUrl();
  if(!u) return null;
  const res = await fetch(u, { method:'POST', body: JSON.stringify(body) });
  return res.json();
}

async function cargar(){
  const u = currentUrl();
  if(!u){ document.getElementById('tabla-creativos').innerHTML = '<tr><td>Configurá primero la URL de esta marca.</td></tr>'; return; }
  const res = await fetch(u);
  data = await res.json();
  renderCreativos(); renderPublicos(); renderEstructura(); renderReglas(); renderResumen(7);
}

// ---------- CREATIVOS ----------
function campoDosLabel(){ return brand==='amuleto' ? 'Estampa/Liso' : 'Hook'; }
let creativosSort = { field: 'ID', asc: true };
function renderCreativos(){
  if(!data) return;
  const cols = [['ID','ID'],['Título','Título (Hook)'],['Formato','Formato'],['Hook',campoDosLabel()],['Producto','Producto'],['Ángulo / dolor','Ángulo']];
  let html = '<tr>' + cols.map(([field,label])=>{
    const arrow = creativosSort.field===field ? (creativosSort.asc?' ▲':' ▼') : '';
    return `<th class="th-sort" data-field="${field}" style="cursor:pointer">${label}${arrow}</th>`;
  }).join('') + '</tr>';
  const rows = data.creativos.slice().sort((a,b)=>{
    const f = creativosSort.field;
    const av = (a[f]||'').toString(), bv = (b[f]||'').toString();
    return creativosSort.asc ? av.localeCompare(bv, 'es', {numeric:true}) : bv.localeCompare(av, 'es', {numeric:true});
  });
  rows.forEach(c=>{
    html += `<tr><td>${c.ID}</td><td><b>${c.Título||''}</b></td><td>${c.Formato||''}</td><td>${c.Hook||''}</td><td>${c.Producto||''}</td><td>${c['Ángulo / dolor']||''}</td></tr>`;
  });
  document.getElementById('tabla-creativos').innerHTML = html;
  document.querySelectorAll('#tabla-creativos .th-sort').forEach(th=>{
    th.onclick = ()=>{
      const f = th.dataset.field;
      if(creativosSort.field===f) creativosSort.asc = !creativosSort.asc;
      else creativosSort = { field:f, asc:true };
      renderCreativos();
    };
  });
}
function fillSelect(sel, options, placeholder){
  sel.innerHTML = (placeholder ? `<option value="">${placeholder}</option>` : '') + options.map(o=>`<option>${o}</option>`).join('');
}
function openCreativoForm(){
  fillSelect(document.getElementById('fc-formato'), data.opciones.formato, '(elegir)');
  fillSelect(document.getElementById('fc-hook'), data.opciones.hook, '(elegir)');
  fillSelect(document.getElementById('fc-producto'), data.opciones.producto, '(elegir)');
  fillSelect(document.getElementById('fc-angulo'), data.opciones.angulo, '(elegir)');
  document.getElementById('fc-hook-label').textContent = campoDosLabel();
  document.getElementById('fc-titulo').value = '';
  document.getElementById('form-creativo').classList.remove('hidden');
}
document.getElementById('btn-refrescar-c').onclick = cargar;
document.getElementById('btn-nuevo-creativo').onclick = openCreativoForm;
document.getElementById('fc-cancelar').onclick = ()=> document.getElementById('form-creativo').classList.add('hidden');
document.getElementById('fc-guardar').onclick = async ()=>{
  const titulo = document.getElementById('fc-titulo').value.trim();
  if(!titulo){ alert('Falta el título.'); return; }
  await postAction({ action:'addCreativo', titulo,
    formato: document.getElementById('fc-formato').value,
    hook: document.getElementById('fc-hook').value,
    producto: document.getElementById('fc-producto').value,
    angulo: document.getElementById('fc-angulo').value });
  document.getElementById('form-creativo').classList.add('hidden');
  cargar();
};
document.querySelectorAll('.btn-add-opcion').forEach(btn=>{
  btn.onclick = async ()=>{
    const valor = prompt('Nueva opción de '+btn.dataset.tipo+':');
    if(!valor) return;
    await postAction({ action:'addOption', tipo: btn.dataset.tipo, valor });
    await cargar();
    const sel = document.getElementById(btn.dataset.target);
    if(sel){ sel.value = valor; }
  };
});

// ---------- PUBLICOS ----------
function renderPublicos(){
  if(!data) return;
  let html = '<tr><th>ID</th><th>Título</th><th>Intereses</th></tr>';
  data.publicos.forEach(p=>{
    html += `<tr><td>${p.ID}</td><td><b>${p.Título||''}</b></td><td>${p.Intereses||''}</td></tr>`;
  });
  document.getElementById('tabla-publicos').innerHTML = html;
}
document.getElementById('btn-nuevo-publico').onclick = ()=>{
  document.getElementById('fp-titulo').value=''; document.getElementById('fp-intereses').value='';
  document.getElementById('form-publico').classList.remove('hidden');
};
document.getElementById('fp-cancelar').onclick = ()=> document.getElementById('form-publico').classList.add('hidden');
document.getElementById('fp-guardar').onclick = async ()=>{
  const titulo = document.getElementById('fp-titulo').value.trim();
  if(!titulo){ alert('Falta el título.'); return; }
  await postAction({ action:'addPublico', titulo, intereses: document.getElementById('fp-intereses').value.trim() });
  document.getElementById('form-publico').classList.add('hidden');
  cargar();
};

// ---------- ESTRUCTURA ----------
let soloActivos = true;
let estructuraSort = { field: null, asc: true };
document.getElementById('filter-activos').onclick = ()=>{ soloActivos=true; toggleFiltro(); renderEstructura(); };
document.getElementById('filter-todos').onclick = ()=>{ soloActivos=false; toggleFiltro(); renderEstructura(); };
document.getElementById('filtro-campana').onchange = renderEstructura;
document.getElementById('filtro-conjunto').onchange = renderEstructura;
document.getElementById('filtro-anuncio').oninput = renderEstructura;
function toggleFiltro(){
  document.getElementById('filter-activos').classList.toggle('active', soloActivos);
  document.getElementById('filter-todos').classList.toggle('active', !soloActivos);
}

function weekBlocks(headers){
  const blocks = {};
  headers.forEach(h=>{
    const m = String(h).match(/^\+(\d+) días (.+)$/);
    if(m){ const dias = parseInt(m[1],10); blocks[dias] = blocks[dias]||[]; blocks[dias].push(h); }
  });
  return Object.keys(blocks).map(Number).sort((a,b)=>a-b).map(d=>({dias:d, cols:blocks[d]}));
}
function parseCond(cond, metricas){
  const parts = cond.split(/\s+Y\s+|\s+O\s+/i);
  const isOr = /\sO\s/i.test(cond);
  const results = parts.map(p=>{
    const m = p.trim().match(/([A-Za-zÁÉÍÓÚñÑ]+)\s*(>=|<=|>|<|=)\s*([\d.]+)/);
    if(!m) return null;
    const [_, metric, op, val] = m;
    const v = metricas[metric];
    if(v===undefined || v==='') return null;
    const num = parseFloat(v), target = parseFloat(val);
    switch(op){ case '>': return num>target; case '<': return num<target; case '>=': return num>=target; case '<=': return num<=target; case '=': return num===target; }
    return null;
  });
  if(results.some(r=>r===null)) return null;
  return isOr ? results.some(Boolean) : results.every(Boolean);
}
function ruleColor(metricas){
  if(!data.reglas || !data.reglas.length) return '';
  for(const r of data.reglas){
    if(!r.Condición) continue;
    const ok = parseCond(r.Condición, metricas);
    if(ok){
      if(r.Color==='Rojo') return 'r-bad';
      if(r.Color==='Ámbar'||r.Color==='Ambar') return 'r-warn';
      if(r.Color==='Verde') return 'r-ok';
    }
  }
  return '';
}
function formatFecha(v){
  if(!v) return '';
  const d = new Date(v);
  if(isNaN(d)) return v;
  return d.toISOString().slice(0,10);
}
function creativoById(id){ return data.creativos.find(c=>c.ID===id) || {}; }

function renderEstructura(){
  if(!data) return;
  const blocks = weekBlocks(data.estructuraHeaders);
  const metricLabels = METRIC_LABELS[brand];

  // poblar selects de filtro conservando la selección actual
  const campSel = document.getElementById('filtro-campana');
  const conjSel = document.getElementById('filtro-conjunto');
  const campActual = campSel.value, conjActual = conjSel.value;
  const campanas = [...new Set(data.estructura.map(e=>e.Campaña).filter(Boolean))].sort();
  const conjuntos = [...new Set(data.estructura.map(e=>e.Conjunto).filter(Boolean))].sort();
  campSel.innerHTML = '<option value="">Todas las campañas</option>' + campanas.map(c=>`<option ${c===campActual?'selected':''}>${c}</option>`).join('');
  conjSel.innerHTML = '<option value="">Todos los conjuntos</option>' + conjuntos.map(c=>`<option ${c===conjActual?'selected':''}>${c}</option>`).join('');

  const fCampana = campSel.value, fConjunto = conjSel.value, fAnuncio = document.getElementById('filtro-anuncio').value.trim().toLowerCase();

  let rows = data.estructura.slice();
  rows = rows.filter(r=> !soloActivos || r.Estado==='Activo');
  if(fCampana) rows = rows.filter(r=> r.Campaña===fCampana);
  if(fConjunto) rows = rows.filter(r=> r.Conjunto===fConjunto);
  if(fAnuncio) rows = rows.filter(r=> String(r.Anuncio||'').toLowerCase().includes(fAnuncio));

  const hoy = new Date();
  function antiguedad(r){ const d = new Date(r['Fecha inicio']); return isNaN(d) ? -1 : Math.round((hoy-d)/86400000); }

  if(estructuraSort.field){
    const f = estructuraSort.field;
    rows.sort((a,b)=>{
      let av, bv;
      if(f==='Antigüedad'){ av = antiguedad(a); bv = antiguedad(b); return estructuraSort.asc ? av-bv : bv-av; }
      av = (a[f]||'').toString(); bv = (b[f]||'').toString();
      return estructuraSort.asc ? av.localeCompare(bv,'es',{numeric:true}) : bv.localeCompare(av,'es',{numeric:true});
    });
  } else {
    rows.sort((a,b)=>{
      if(a.Estado!==b.Estado) return a.Estado==='Activo' ? -1 : 1;
      if(a.Campaña!==b.Campaña) return String(a.Campaña).localeCompare(String(b.Campaña));
      if(a.Conjunto!==b.Conjunto) return String(a.Conjunto).localeCompare(String(b.Conjunto));
      return new Date(b['Fecha inicio']) - new Date(a['Fecha inicio']);
    });
  }

  const sortCols = [['Campaña','Campaña'],['Conjunto','Conjunto'],['Anuncio','Anuncio'],['Antigüedad','Inicio']];
  let thead = '<tr><th></th>' + sortCols.map(([field,label])=>{
    const arrow = estructuraSort.field===field ? (estructuraSort.asc?' ▲':' ▼') : '';
    return `<th class="th-sort-e" data-field="${field}" style="cursor:pointer">${label}${arrow}</th>`;
  }).join('');
  blocks.forEach(b=>{ thead += `<th colspan="${b.cols.length}" style="text-align:center;border-left:1px solid var(--border)">+${b.dias}d</th>`; });
  thead += '<th></th></tr><tr><th></th><th></th><th></th><th></th><th></th>';
  blocks.forEach(b=>{ b.cols.forEach((c,i)=>{ thead += `<th style="${i===0?'border-left:1px solid var(--border)':''}">${metricLabels[i]||c}</th>`; }); });
  thead += '<th></th></tr>';

  let tbody = '';
  rows.forEach(r=>{
    const off = r.Estado!=='Activo' ? 'off':'';
    tbody += `<tr class="${off}"><td><input type="checkbox" data-id="${r.ID}" ${r.Estado==='Activo'?'checked':''} class="toggle-estado"></td>`;
    tbody += `<td>${r.Campaña||''}</td><td>${r.Conjunto||''}</td><td><b>${r.Anuncio||''}</b></td>`;
    tbody += `<td>${formatFecha(r['Fecha inicio'])}</td>`;
    blocks.forEach(b=>{
      const metricas = {}; b.cols.forEach((c,i)=>{ metricas[metricLabels[i]] = r[c]; });
      const hasData = b.cols.some(c=> r[c]!=='' && r[c]!==undefined);
      const cls = hasData ? ruleColor(metricas) : '';
      b.cols.forEach((c,i)=>{
        tbody += `<td class="${cls}" style="${i===0?'border-left:1px solid var(--border)':''}">${r[c]!==undefined&&r[c]!==''? r[c]:'—'}</td>`;
      });
    });
    tbody += `<td><button class="btn-editar-dato" data-id="${r.ID}" title="Cargar/editar dato semanal">✏️</button></td>`;
    tbody += '</tr>';
  });
  document.getElementById('tabla-estructura').innerHTML = '<thead>'+thead+'</thead><tbody>'+tbody+'</tbody>';

  document.querySelectorAll('.toggle-estado').forEach(el=>{
    el.onchange = async ()=>{ await postAction({ action:'updateEstructura', id:el.dataset.id, estado: el.checked?'Activo':'Apagado' }); cargar(); };
  });
  document.querySelectorAll('.btn-editar-dato').forEach(btn=>{
    btn.onclick = ()=> openDatoForm(btn.dataset.id);
  });
  document.querySelectorAll('.th-sort-e').forEach(th=>{
    th.onclick = ()=>{
      const f = th.dataset.field;
      if(estructuraSort.field===f) estructuraSort.asc = !estructuraSort.asc;
      else estructuraSort = { field:f, asc: f!=='Antigüedad' };
      renderEstructura();
    };
  });
}

function openEstructuraForm(){
  const campanas = [...new Set(data.estructura.map(e=>e.Campaña).filter(Boolean))];
  fillSelect(document.getElementById('fe-campana-select'), [...campanas, '+ Nueva campaña'], '(elegir)');
  document.getElementById('fe-campana-nueva').classList.add('hidden');
  document.getElementById('fe-campana-nueva').value = '';

  const pubSel = document.getElementById('fe-publico-select');
  pubSel.innerHTML = '<option value="">(elegir)</option>' +
    data.publicos.map(p=>`<option value="${p.ID}">${p.Título}</option>`).join('') +
    '<option value="__nuevo__">+ Nuevo público</option>';
  document.getElementById('fe-publico-nuevo').classList.add('hidden');
  document.getElementById('fe-publico-titulo').value=''; document.getElementById('fe-publico-intereses').value='';

  const creSel = document.getElementById('fe-creativo-select');
  creSel.innerHTML = '<option value="">(elegir)</option>' +
    data.creativos.map(c=>`<option value="${c.ID}">${c.Título}</option>`).join('') +
    '<option value="__nuevo__">+ Nuevo creativo</option>';
  document.getElementById('fe-creativo-nuevo').classList.add('hidden');
  document.getElementById('fe-creativo-titulo').value='';
  fillSelect(document.getElementById('fe-creativo-formato'), data.opciones.formato, '(elegir)');
  fillSelect(document.getElementById('fe-creativo-hook'), data.opciones.hook, '(elegir)');
  fillSelect(document.getElementById('fe-creativo-producto'), data.opciones.producto, '(elegir)');
  fillSelect(document.getElementById('fe-creativo-angulo'), data.opciones.angulo, '(elegir)');

  document.getElementById('fe-fecha').value = new Date().toISOString().slice(0,10);
  document.getElementById('form-estructura').classList.remove('hidden');
}
document.getElementById('btn-nueva-estructura').onclick = ()=>{
  if(!data.publicos.length && !confirm('Todavía no cargaste ningún Público — vas a tener que crear uno nuevo acá. ¿Seguir?')) return;
  if(!data.creativos.length && !confirm('Todavía no cargaste ningún Creativo — vas a tener que crear uno nuevo acá. ¿Seguir?')) return;
  openEstructuraForm();
};
document.getElementById('fe-cancelar').onclick = ()=> document.getElementById('form-estructura').classList.add('hidden');
document.getElementById('fe-campana-select').onchange = (e)=>{
  document.getElementById('fe-campana-nueva').classList.toggle('hidden', e.target.value !== '+ Nueva campaña');
};
document.getElementById('fe-publico-select').onchange = (e)=>{
  document.getElementById('fe-publico-nuevo').classList.toggle('hidden', e.target.value !== '__nuevo__');
};
document.getElementById('fe-creativo-select').onchange = (e)=>{
  document.getElementById('fe-creativo-nuevo').classList.toggle('hidden', e.target.value !== '__nuevo__');
};
document.getElementById('fe-guardar').onclick = async ()=>{
  let campana = document.getElementById('fe-campana-select').value;
  if(campana === '+ Nueva campaña') campana = document.getElementById('fe-campana-nueva').value.trim();
  if(!campana){ alert('Falta la campaña.'); return; }

  let publicoId = document.getElementById('fe-publico-select').value;
  if(publicoId === '__nuevo__'){
    const titulo = document.getElementById('fe-publico-titulo').value.trim();
    if(!titulo){ alert('Falta el título del público nuevo.'); return; }
    const r = await postAction({ action:'addPublico', titulo, intereses: document.getElementById('fe-publico-intereses').value.trim() });
    publicoId = r.id;
  }
  if(!publicoId){ alert('Falta elegir un público.'); return; }

  let creativoId = document.getElementById('fe-creativo-select').value;
  if(creativoId === '__nuevo__'){
    const titulo = document.getElementById('fe-creativo-titulo').value.trim();
    if(!titulo){ alert('Falta el título del creativo nuevo.'); return; }
    const r = await postAction({ action:'addCreativo', titulo,
      formato: document.getElementById('fe-creativo-formato').value,
      hook: document.getElementById('fe-creativo-hook').value,
      producto: document.getElementById('fe-creativo-producto').value,
      angulo: document.getElementById('fe-creativo-angulo').value });
    creativoId = r.id;
  }
  if(!creativoId){ alert('Falta elegir un creativo.'); return; }

  const fechaInicio = document.getElementById('fe-fecha').value;
  const r = await postAction({ action:'addEstructura', campana, publicoId, creativoId, fechaInicio });
  if(r && r.error) alert(r.error);
  document.getElementById('form-estructura').classList.add('hidden');
  cargar();
};
function openDatoForm(presetId){
  const sel = document.getElementById('fd-fila');
  sel.innerHTML = '<option value="">(elegir)</option>' + data.estructura
    .slice()
    .sort((a,b)=> String(a.Campaña).localeCompare(String(b.Campaña)) || String(a.Conjunto).localeCompare(String(b.Conjunto)))
    .map(r=>`<option value="${r.ID}">${r.Campaña} &gt; ${r.Conjunto} &gt; ${r.Anuncio}</option>`).join('');
  if(presetId){ sel.value = presetId; sel.disabled = true; } else { sel.disabled = false; }

  const blocks = weekBlocks(data.estructuraHeaders);
  const existentes = blocks.map(b=>b.dias);
  const sugeridas = [7,14,21,28,35,42,49,56,63,70];
  const opcionesDias = [...new Set([...existentes, ...sugeridas])].sort((a,b)=>a-b);
  const diasSel = document.getElementById('fd-dias');
  diasSel.innerHTML = opcionesDias.map(d=>`<option value="${d}">+${d} días</option>`).join('') + '<option value="__otro__">Otra antigüedad...</option>';

  const labels = METRIC_LABELS[brand];
  document.getElementById('fd-metricas').innerHTML = labels.map(l=>
    `<div class="row"><label style="width:110px">${l}</label><input type="number" step="any" class="fd-metrica" data-metrica="${l}" style="flex:1"></div>`
  ).join('');

  document.getElementById('form-dato').classList.remove('hidden');
}
document.getElementById('btn-nuevo-dato').onclick = ()=>{
  if(!data.estructura.length){ alert('Primero creá al menos una fila en Estructura.'); return; }
  openDatoForm();
};
document.getElementById('fd-cancelar').onclick = ()=> document.getElementById('form-dato').classList.add('hidden');
document.getElementById('fd-dias').onchange = (e)=>{
  if(e.target.value === '__otro__'){
    const v = prompt('Antigüedad en días:');
    if(v){
      const opt = document.createElement('option');
      opt.value = v; opt.textContent = '+'+v+' días'; opt.selected = true;
      e.target.insertBefore(opt, e.target.lastElementChild);
    } else {
      e.target.selectedIndex = 0;
    }
  }
};
document.getElementById('fd-guardar').onclick = async ()=>{
  const id = document.getElementById('fd-fila').value;
  if(!id){ alert('Elegí a qué fila corresponde el dato.'); return; }
  const dias = parseInt(document.getElementById('fd-dias').value, 10);
  if(!dias){ alert('Elegí la antigüedad.'); return; }
  const metricas = {};
  document.querySelectorAll('.fd-metrica').forEach(inp=>{ metricas[inp.dataset.metrica] = parseFloat(inp.value)||0; });
  await postAction({ action:'setWeekBlock', id, dias, metricas });
  document.getElementById('form-dato').classList.add('hidden');
  cargar();
};

// ---------- REGLAS ----------
function renderReglas(){
  if(!data) return;
  let html = '<tr><th>Color</th><th>Condición</th><th>Acción sugerida</th></tr>';
  data.reglas.forEach((r,i)=>{
    html += `<tr>
      <td><select data-i="${i}" class="regla-color"><option ${r.Color==='Rojo'?'selected':''}>Rojo</option><option ${r.Color==='Ámbar'?'selected':''}>Ámbar</option><option ${r.Color==='Verde'?'selected':''}>Verde</option></select></td>
      <td><input data-i="${i}" class="regla-cond" style="width:100%" value="${r.Condición||''}"></td>
      <td><input data-i="${i}" class="regla-accion" style="width:100%" value="${r['Acción sugerida']||''}"></td>
    </tr>`;
  });
  document.getElementById('tabla-reglas').innerHTML = html;
}
document.getElementById('btn-agregar-regla').onclick = ()=>{
  data.reglas.push({ Color:'Ámbar', Condición:'', 'Acción sugerida':'' });
  renderReglas();
};
document.getElementById('btn-guardar-reglas').onclick = async ()=>{
  const reglas = data.reglas.map((r,i)=>({
    color: document.querySelector(`.regla-color[data-i="${i}"]`).value,
    condicion: document.querySelector(`.regla-cond[data-i="${i}"]`).value,
    accion: document.querySelector(`.regla-accion[data-i="${i}"]`).value,
  }));
  await postAction({ action:'setRules', reglas });
  cargar();
};

// ---------- RESUMEN ----------
document.querySelectorAll('.periodo').forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll('.periodo').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    renderResumen(parseInt(b.dataset.dias,10));
  };
});

function renderResumen(periodoDias){
  if(!data) return;
  const blocks = weekBlocks(data.estructuraHeaders);
  const metricLabels = METRIC_LABELS[brand];
  const perfMetric = metricLabels[1];
  const hoy = new Date();
  const sinLimite = periodoDias === 0;
  const desde = sinLimite ? new Date(0) : new Date(hoy.getTime() - periodoDias*86400000);

  // puntos: un dato semanal (dentro del período) por fila de Estructura
  const puntos = []; // {creativoId, campana, conjunto, dias, valor, compras}
  data.estructura.forEach(ad=>{
    const inicio = new Date(ad['Fecha inicio']);
    blocks.forEach(b=>{
      const fechaBloque = new Date(inicio.getTime() + b.dias*86400000);
      if(!sinLimite && (fechaBloque<desde || fechaBloque>hoy)) return;
      if(fechaBloque>hoy) return;
      const val = ad[b.cols[1]];
      const compras = ad[b.cols[2]];
      if(val==='' || val===undefined) return;
      puntos.push({
        creativoId: ad.CreativoID, campana: ad.Campaña, conjunto: ad.Conjunto, estructuraId: ad.ID,
        dias: b.dias, valor: parseFloat(val)||0, compras: parseFloat(compras)||0
      });
    });
  });
  const puntosPositivos = puntos.filter(p=>p.valor>0);

  // ROAS/Resultados promedio (solo valores > 0)
  const roasProm = puntosPositivos.length ? puntosPositivos.reduce((a,p)=>a+p.valor,0)/puntosPositivos.length : null;

  // agrupadores genéricos
  function agrupar(campo){
    const grupos = {};
    puntosPositivos.forEach(p=>{
      const k = p[campo] || '(sin dato)';
      grupos[k] = grupos[k] || { valores:[], compras:0 };
      grupos[k].valores.push(p.valor);
      grupos[k].compras += p.compras;
    });
    return Object.keys(grupos).map(k=>({
      name:k, compras: grupos[k].compras,
      val: grupos[k].valores.reduce((a,b)=>a+b,0)/grupos[k].valores.length,
      n: grupos[k].valores.length
    })).sort((a,b)=>b.val-a.val);
  }
  const porConjunto = agrupar('conjunto');
  const porCampana = agrupar('campana');
  const porCreativo = agrupar('creativoId');
  const mejorConjunto = porConjunto[0];
  const mejorCampana = porCampana[0];
  const mejorCreativo = porCreativo[0];
  const mejorCreativoObj = mejorCreativo ? creativoById(mejorCreativo.name) : null;

  // anuncios en rojo / verde (si alguna semana del período dio ese color, aunque no sea la más reciente)
  let rojoCount=0, verdeCount=0;
  data.estructura.forEach(ad=>{
    const inicio = new Date(ad['Fecha inicio']);
    let huboRojo=false, huboVerde=false;
    blocks.forEach(b=>{
      const fechaBloque = new Date(inicio.getTime() + b.dias*86400000);
      if(!sinLimite && (fechaBloque<desde || fechaBloque>hoy)) return;
      if(fechaBloque>hoy) return;
      const metricas = {}; b.cols.forEach((c,i)=>{ metricas[metricLabels[i]] = ad[c]; });
      const hasData = b.cols.some(c=> ad[c]!=='' && ad[c]!==undefined);
      if(!hasData) return;
      const color = ruleColor(metricas);
      if(color==='r-bad') huboRojo=true;
      if(color==='r-ok') huboVerde=true;
    });
    if(huboRojo) rojoCount++;
    if(huboVerde) verdeCount++;
  });

  // antigüedad promedio de creativos, en cantidad de semanas con datos cargados (dentro del período)
  const semanasPorCreativo = {};
  puntos.forEach(p=>{
    semanasPorCreativo[p.creativoId] = semanasPorCreativo[p.creativoId] || new Set();
    semanasPorCreativo[p.creativoId].add(p.dias);
  });
  const semanasConteos = Object.values(semanasPorCreativo).map(s=>s.size);
  const antigSemanasProm = semanasConteos.length ? (semanasConteos.reduce((a,b)=>a+b,0)/semanasConteos.length).toFixed(1) : null;

  document.getElementById('resumen-cards').innerHTML = `
    <div class="metric"><p class="lbl">${perfMetric} promedio</p><p class="val">${roasProm===null?'—':roasProm.toFixed(1)}</p></div>
    <div class="metric"><p class="lbl">Mejor conjunto</p><p class="val" style="font-size:15px">${mejorConjunto?mejorConjunto.name:'—'}</p><p class="lbl">${mejorConjunto?mejorConjunto.val.toFixed(1)+' · '+Math.round(mejorConjunto.compras)+' compras':''}</p></div>
    <div class="metric"><p class="lbl">Mejor campaña</p><p class="val" style="font-size:15px">${mejorCampana?mejorCampana.name:'—'}</p><p class="lbl">${mejorCampana?mejorCampana.val.toFixed(1)+' · '+Math.round(mejorCampana.compras)+' compras':''}</p></div>
    <div class="metric"><p class="lbl">Mejor creativo</p><p class="val" style="font-size:15px">${mejorCreativoObj?mejorCreativoObj.Título:'—'}</p><p class="lbl">${mejorCreativo?mejorCreativo.val.toFixed(1)+' · '+Math.round(mejorCreativo.compras)+' compras':''}${mejorCreativoObj?' · '+(mejorCreativoObj.Producto||'')+' · '+(mejorCreativoObj.Hook||''):''}</p></div>
    <div class="metric"><p class="lbl">Anuncios en rojo</p><p class="val" style="color:var(--red-tx)">${rojoCount}</p></div>
    <div class="metric"><p class="lbl">Anuncios en verde</p><p class="val" style="color:var(--green-tx)">${verdeCount}</p></div>
    <div class="metric"><p class="lbl">Antigüedad promedio de creativos (semanas con datos)</p><p class="val">${antigSemanasProm===null?'—':antigSemanasProm}</p></div>
  `;

  function top5Html(titulo, lista, asc){
    const ordenada = lista.slice().sort((a,b)=> asc? a.val-b.val : b.val-a.val).slice(0,5);
    if(!ordenada.length) return `<div class="card"><p class="lbl" style="font-weight:bold">${titulo}</p><p class="lbl">Sin datos en este período</p></div>`;
    let html = `<div class="card"><p class="lbl" style="font-weight:bold;margin-bottom:8px">${titulo}</p><table><tr><th>${perfMetric}</th><th>Hook (título)</th><th>Formato</th><th>Ángulo/dolor</th><th>Producto</th></tr>`;
    ordenada.forEach(it=>{
      const cre = creativoById(it.name) || {};
      html += `<tr><td><b>${it.val.toFixed(1)}</b></td><td>${cre.Título||''}</td><td>${cre.Formato||''}</td><td>${cre['Ángulo / dolor']||''}</td><td>${cre.Producto||''}</td></tr>`;
    });
    html += '</table></div>';
    return html;
  }
  document.getElementById('resumen-rankings').innerHTML =
    top5Html('TOP 5 MEJORES', porCreativo, false) +
    top5Html('TOP 5 PEORES', porCreativo, true);
}

cargar();
</script>
